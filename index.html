<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef4f7">
  <title>Daylight — Weather, at a glance</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --ink: #172b3b;
      --muted: #788894;
      --line: #e7edf0;
      --surface: rgba(255, 255, 255, .9);
      --soft: #f5f8f9;
      --accent: #e9a43b;
      --accent-wash: #fff3dc;
      --sky: #e8f4fa;
      --shadow: 0 24px 70px rgba(34, 62, 78, .12);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 46px 20px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, .9), transparent 55%),
        linear-gradient(160deg, #f8f4e9 0%, #edf5f7 48%, #e8f0f3 100%);
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(100%, 470px);
      padding: 30px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .topline, .brand, .location, .search, .forecast-heading, .day, .range {
      display: flex;
      align-items: center;
    }

    .topline { justify-content: space-between; margin-bottom: 27px; }
    .brand { gap: 10px; font-size: 15px; font-weight: 750; letter-spacing: -.3px; }
    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: #885816;
      background: var(--accent-wash);
    }
    .brand-mark svg { width: 19px; height: 19px; }
    .updated { color: var(--muted); font-size: 12px; }

    .search {
      gap: 10px;
      height: 46px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--soft);
      transition: border-color .2s, box-shadow .2s;
    }
    .search:focus-within { border-color: #9dc9dd; box-shadow: 0 0 0 3px rgba(108, 174, 203, .14); }
    .search svg { flex: 0 0 auto; width: 18px; height: 18px; color: var(--muted); }
    .search input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-size: 14px;
    }
    .search input::placeholder { color: #99a6ae; }
    .search button {
      flex: 0 0 auto;
      border: 0;
      padding: 6px 9px;
      border-radius: 9px;
      color: #607989;
      background: #e8f0f3;
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
    }
    .search button:hover { background: #dce9ee; }

    .weather {
      padding: 27px 0 22px;
      text-align: center;
    }
    .location { justify-content: center; gap: 7px; color: var(--muted); font-size: 13px; font-weight: 600; }
    .location svg { width: 15px; height: 15px; }
    h1 { margin: 5px 0 0; font-size: 24px; letter-spacing: -.8px; }
    .current-icon { width: 96px; height: 85px; margin: 17px auto 4px; display: grid; place-items: center; color: var(--accent); }
    .current-icon svg { width: 88px; height: 80px; overflow: visible; }
    .temperature { font-size: 70px; line-height: 1; font-weight: 650; letter-spacing: -5px; }
    .temperature sup { position: relative; top: -1.02em; margin-left: 3px; font-size: 22px; font-weight: 500; letter-spacing: 0; }
    .condition { margin-top: 9px; color: var(--muted); font-size: 14px; }

    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin: 3px 0 26px;
      padding: 15px 4px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(249, 251, 252, .8);
    }
    .detail { text-align: center; }
    .detail + .detail { border-left: 1px solid var(--line); }
    .detail-label { color: var(--muted); font-size: 11px; }
    .detail-value { margin-top: 5px; font-size: 14px; font-weight: 650; }

    .forecast-heading { justify-content: space-between; margin-bottom: 13px; }
    .forecast-heading h2 { margin: 0; font-size: 14px; letter-spacing: -.2px; }
    .forecast-heading span { color: var(--muted); font-size: 11px; }
    .forecast { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .day {
      min-height: 105px;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: var(--soft);
    }
    .day:first-child { border-color: rgba(233, 164, 59, .25); background: var(--accent-wash); }
    .day-name { color: var(--muted); font-size: 11px; font-weight: 600; }
    .day-icon { width: 28px; height: 27px; display: grid; place-items: center; color: var(--accent); }
    .day-icon svg { width: 27px; height: 25px; }
    .range { gap: 5px; font-size: 11px; font-weight: 650; }
    .range span:last-child { color: #9aa5ab; font-weight: 500; }
    .message { min-height: 18px; margin: 11px 1px 0; color: var(--muted); font-size: 11px; text-align: center; }
    .message.error { color: #a64b37; }
    .footer { margin-top: 9px; color: #9ba7ad; font-size: 10px; text-align: center; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #e7edf0;
        --muted: #a5b1b8;
        --line: #34444d;
        --surface: rgba(31, 44, 52, .94);
        --soft: #293941;
        --accent: #f3bb62;
        --accent-wash: #423829;
        --sky: #263d49;
        --shadow: 0 24px 70px rgba(0, 0, 0, .35);
      }
      body { background: radial-gradient(ellipse at 50% 0%, #344851, transparent 56%), linear-gradient(155deg, #17242c, #1d3039 65%, #19272e); }
      .search button { color: #c1d2da; background: #354a54; }
      .search button:hover { background: #405862; }
      .details { background: rgba(24, 37, 44, .6); }
      .day:first-child { border-color: rgba(243, 187, 98, .2); }
      .range span:last-child { color: #86969e; }
      .footer { color: #809099; }
    }

    @media (max-width: 420px) {
      body { padding: 20px 12px; }
      .app { padding: 23px 18px; border-radius: 24px; }
      .forecast { gap: 5px; }
      .day { min-height: 99px; border-radius: 12px; }
      .range { gap: 3px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topline">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
        </span>
        <span>daylight</span>
      </div>
      <span class="updated" id="updated">Live weather</span>
    </header>

    <form class="search" id="search-form" role="search">
      <label class="sr-only" for="city-input">Search for a city</label>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="city-input" type="search" placeholder="Search any city…" autocomplete="off">
      <button type="submit">Search</button>
    </form>

    <section class="weather" aria-live="polite">
      <div class="location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span id="region">Tunisia</span>
      </div>
      <h1 id="city">Tunis</h1>
      <div class="current-icon" id="current-icon" aria-hidden="true"></div>
      <div class="temperature" id="temperature">--<sup>°</sup></div>
      <div class="condition" id="condition">Loading today’s weather…</div>
    </section>

    <section class="details" aria-label="Current conditions">
      <div class="detail"><div class="detail-label">Feels like</div><div class="detail-value" id="feels">--°</div></div>
      <div class="detail"><div class="detail-label">Humidity</div><div class="detail-value" id="humidity">--%</div></div>
      <div class="detail"><div class="detail-label">Wind</div><div class="detail-value" id="wind">-- km/h</div></div>
    </section>

    <section aria-labelledby="forecast-title">
      <div class="forecast-heading">
        <h2 id="forecast-title">5-day forecast</h2>
        <span>Daily outlook</span>
      </div>
      <div class="forecast" id="forecast"></div>
    </section>
    <div class="message" id="message" role="status"></div>
    <footer class="footer">Weather data by Open-Meteo</footer>
  </main>

  <script>
    const weatherTypes = {
      0: ["Clear sky", "sun"], 1: ["Mostly clear", "sun"], 2: ["Partly cloudy", "partly"],
      3: ["Overcast", "cloud"], 45: ["Foggy", "fog"], 48: ["Rime fog", "fog"],
      51: ["Light drizzle", "rain"], 53: ["Drizzle", "rain"], 55: ["Heavy drizzle", "rain"],
      56: ["Freezing drizzle", "rain"], 57: ["Freezing drizzle", "rain"],
      61: ["Light rain", "rain"], 63: ["Rain", "rain"], 65: ["Heavy rain", "rain"],
      66: ["Freezing rain", "rain"], 67: ["Heavy freezing rain", "rain"],
      71: ["Light snow", "snow"], 73: ["Snow", "snow"], 75: ["Heavy snow", "snow"],
      77: ["Snow grains", "snow"], 80: ["Light showers", "rain"], 81: ["Showers", "rain"],
      82: ["Heavy showers", "rain"], 85: ["Snow showers", "snow"], 86: ["Heavy snow showers", "snow"],
      95: ["Thunderstorm", "storm"], 96: ["Thunder & hail", "storm"], 99: ["Thunder & hail", "storm"]
    };

    const icons = {
      sun: '<svg viewBox="0 0 80 72" fill="none" aria-hidden="true"><circle cx="40" cy="35" r="14" fill="currentColor"/><g stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M40 5v8M40 57v8M10 35h8m44 0h8M19 14l6 6m30 30 6 6m0-42-6 6M25 50l-6 6"/></g></svg>',
      partly: '<svg viewBox="0 0 80 72" fill="none" aria-hidden="true"><circle cx="49" cy="25" r="13" fill="currentColor"/><g stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M49 4v5m0 32v5M28 25h5m32 0h5M34 10l4 4m22 22 4 4m0-30-4 4M38 36l-4 4"/></g><path d="M20 57h38a10 10 0 0 0 1-20 15 15 0 0 0-28-3 12 12 0 0 0-11 23Z" fill="#dbeaf0" stroke="#90aebc" stroke-width="2.5" stroke-linejoin="round"/></svg>',
      cloud: '<svg viewBox="0 0 80 72" fill="none" aria-hidden="true"><path d="M18 57h42a12 12 0 0 0 1-24 17 17 0 0 0-32-3 14 14 0 0 0-11 27Z" fill="#dceaf0" stroke="#8daab7" stroke-width="3" stroke-linejoin="round"/></svg>',
      fog: '<svg viewBox="0 0 80 72" fill="none" aria-hidden="true"><path d="M19 43h41a10 10 0 0 0 1-20 15 15 0 0 0-28-3 12 12 0 0 0-14 23Z" fill="#dceaf0" stroke="#8daab7" stroke-width="2.5" stroke-linejoin="round"/><g stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M15 52h48M21 61h37"/></g></svg>',
      rain: '<svg viewBox="0 0 80 72" fill="none" aria-hidden="true"><path d="M17 43h43a11 11 0 0 0 1-22 16 16 0 0 0-30-3 13 13 0 0 0-14 25Z" fill="#dceaf0" stroke="#8daab7" stroke-width="2.5" stroke-linejoin="round"/><g stroke="#62a9cc" stroke-width="3.5" stroke-linecap="round"><path d="m27 52-3 7m17-7-3 7m17-7-3 7"/></g></svg>',
      snow: '<svg viewBox="0 0 80 72" fill="none" aria-hidden="true"><path d="M17 42h43a11 11 0 0 0 1-22 16 16 0 0 0-30-3 13 13 0 0 0-14 25Z" fill="#dceaf0" stroke="#8daab7" stroke-width="2.5" stroke-linejoin="round"/><g fill="#71acd0"><circle cx="26" cy="55" r="3"/><circle cx="42" cy="59" r="3"/><circle cx="57" cy="53" r="3"/></g></svg>',
      storm: '<svg viewBox="0 0 80 72" fill="none" aria-hidden="true"><path d="M17 42h43a11 11 0 0 0 1-22 16 16 0 0 0-30-3 13 13 0 0 0-14 25Z" fill="#dceaf0" stroke="#8daab7" stroke-width="2.5" stroke-linejoin="round"/><path d="m43 43-9 13h8l-3 11 13-16h-9l5-8Z" fill="#e9a43b" stroke="#c78525" stroke-width="1.5" stroke-linejoin="round"/></svg>'
    };

    const fallback = {
      current: { temperature_2m: 23, apparent_temperature: 24, relative_humidity_2m: 52, wind_speed_10m: 14, weather_code: 1 },
      daily: {
        time: ["2026-11-07", "2026-11-08", "2026-11-09", "2026-11-10", "2026-11-11"],
        weather_code: [1, 0, 2, 61, 2],
        temperature_2m_max: [25, 26, 24, 21, 22],
        temperature_2m_min: [17, 18, 17, 15, 16]
      }
    };

    const $ = (id) => document.getElementById(id);
    const form = $("search-form");
    const input = $("city-input");
    let activeRequest = 0;

    function weatherInfo(code) {
      return weatherTypes[code] || ["Variable conditions", "partly"];
    }

    function render(data, place, country, isFallback) {
      const current = data.current;
      const [description, icon] = weatherInfo(current.weather_code);
      $("city").textContent = place;
      $("region").textContent = country || "Local forecast";
      $("current-icon").innerHTML = icons[icon];
      $("temperature").innerHTML = `${Math.round(current.temperature_2m)}<sup>°</sup>`;
      $("condition").textContent = description;
      $("feels").textContent = `${Math.round(current.apparent_temperature)}°`;
      $("humidity").textContent = `${current.relative_humidity_2m}%`;
      $("wind").textContent = `${Math.round(current.wind_speed_10m)} km/h`;
      $("updated").textContent = isFallback ? "Sample conditions" : "Updated just now";
      $("message").textContent = isFallback ? "Showing a sample forecast — live weather couldn’t be reached." : "";
      $("message").classList.toggle("error", isFallback);

      const days = data.daily.time.slice(0, 5).map((date, index) => {
        const [label, dayIcon] = weatherInfo(data.daily.weather_code[index]);
        const dayName = index === 0 ? "Today" : new Intl.DateTimeFormat("en", { weekday: "short", timeZone: "UTC" }).format(new Date(`${date}T12:00:00Z`));
        return `<div class="day" title="${label}"><div class="day-name">${dayName}</div><div class="day-icon" aria-label="${label}">${icons[dayIcon]}</div><div class="range"><span>${Math.round(data.daily.temperature_2m_max[index])}°</span><span>${Math.round(data.daily.temperature_2m_min[index])}°</span></div></div>`;
      });
      $("forecast").innerHTML = days.join("");
    }

    async function loadCity(query) {
      const requestId = ++activeRequest;
      $("message").textContent = "";
      $("message").classList.remove("error");
      $("condition").textContent = "Finding your forecast…";
      try {
        const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=1&language=en&format=json`;
        const geoResponse = await fetch(geoUrl);
        if (!geoResponse.ok) throw new Error("Could not search for that city.");
        const geo = await geoResponse.json();
        if (requestId !== activeRequest) return;
        if (!geo.results || !geo.results.length) throw new Error("City not found. Try another name.");
        const place = geo.results[0];
        const params = new URLSearchParams({
          latitude: place.latitude,
          longitude: place.longitude,
          current: "temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m",
          daily: "weather_code,temperature_2m_max,temperature_2m_min",
          timezone: "auto",
          forecast_days: "5"
        });
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
        if (!response.ok) throw new Error("Weather data is temporarily unavailable.");
        const data = await response.json();
        if (requestId !== activeRequest) return;
        render(data, place.name, place.country, false);
      } catch (error) {
        if (requestId !== activeRequest) return;
        if (query.trim().toLowerCase() === "tunis") {
          render(fallback, "Tunis", "Tunisia", true);
        } else {
          $("condition").textContent = "Forecast unavailable";
          $("message").textContent = error.message || "Couldn’t load that forecast. Please try again.";
          $("message").classList.add("error");
        }
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const query = input.value.trim();
      if (query) loadCity(query);
    });

    render(fallback, "Tunis", "Tunisia", true);
    loadCity("Tunis");
  </script>
</body>
</html>
